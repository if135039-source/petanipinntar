// ---------- DATA USER ----------
let user = JSON.parse(localStorage.getItem("ecoFarmingUser")) || {
    username: "Petani Eco",
    coins: 0,
    xp: 0,
    waste: 0,
    exchanges: 0,
    achievements: 0,
    cameraUsed: false,
    aiUsed: false,
    history: [],
    harvest: null,
    irrigation: null
};

// ---------- LEVEL ----------
const levels = [
    { level: 1, name: "Pemula", xp: 0 },
    { level: 2, name: "Pejuang Hijau", xp: 100 },
    { level: 3, name: "Petani Hijau", xp: 250 },
    { level: 4, name: "Pengolah Limbah", xp: 500 },
    { level: 5, name: "Ahli Maggot", xp: 850 },
    { level: 6, name: "Eco Farmer", xp: 1300 },
    { level: 7, name: "Penjaga Lingkungan", xp: 1850 },
    { level: 8, name: "Eco Expert", xp: 2500 },
    { level: 9, name: "Eco Champion", xp: 3300 },
    { level: 10, name: "Eco Master", xp: 4300 }
];

function getLevel() {
    let current = levels[0];

    for (let i = 0; i < levels.length; i++) {
        if (user.xp >= levels[i].xp) {
            current = levels[i];
        }
    }

    return current;
}

function getNextLevel() {
    const current = getLevel();
    return levels.find(l => l.level === current.level + 1) || null;
}

// ---------- SIMPAN DATA ----------
function saveUser() {
    localStorage.setItem("ecoFarmingUser", JSON.stringify(user));
}

// ---------- DASHBOARD ----------
function updateDashboard() {
    const level = getLevel();
    const nextLevel = getNextLevel();

    user.achievements = Math.floor(user.exchanges / 3);

    const usernameElements = document.querySelectorAll(
        "#username, .username, [data-username]"
    );

    usernameElements.forEach(el => {
        el.textContent = user.username;
    });

    const coinElements = document.querySelectorAll(
        "#coinValue, #coins, .coin-value, [data-coins]"
    );

    coinElements.forEach(el => {
        el.textContent = user.coins;
    });

    const xpElements = document.querySelectorAll(
        "#xpValue, #xp, .xp-value, [data-xp]"
    );

    xpElements.forEach(el => {
        el.textContent = user.xp;
    });

    const wasteElements = document.querySelectorAll(
        "#wasteValue, #waste, .waste-value, [data-waste]"
    );

    wasteElements.forEach(el => {
        el.textContent = user.waste;
    });

    const exchangeElements = document.querySelectorAll(
        "#exchangeValue, #exchanges, .exchange-value, [data-exchanges]"
    );

    exchangeElements.forEach(el => {
        el.textContent = user.exchanges;
    });

    const achievementElements = document.querySelectorAll(
        "#achievementValue, #achievements, .achievement-value, [data-achievements]"
    );

    achievementElements.forEach(el => {
        el.textContent = user.achievements;
    });

    const levelElements = document.querySelectorAll(
        "#levelValue, #level, .level-value, [data-level]"
    );

    levelElements.forEach(el => {
        el.textContent = level.level;
    });

    const levelNameElements = document.querySelectorAll(
        "#levelName, .level-name, [data-level-name]"
    );

    levelNameElements.forEach(el => {
        el.textContent = level.name;
    });

    // Progress XP
    if (nextLevel) {
        const progress =
            ((user.xp - level.xp) /
                (nextLevel.xp - level.xp)) * 100;

        const progressBars = document.querySelectorAll(
            ".xp-progress, #xpProgress, [data-xp-progress]"
        );

        progressBars.forEach(bar => {
            bar.style.width = Math.min(progress, 100) + "%";
        });

        const nextXPElements = document.querySelectorAll(
            "#nextXP, .next-xp, [data-next-xp]"
        );

        nextXPElements.forEach(el => {
            el.textContent = nextLevel.xp;
        });
    } else {
        const progressBars = document.querySelectorAll(
            ".xp-progress, #xpProgress, [data-xp-progress]"
        );

        progressBars.forEach(bar => {
            bar.style.width = "100%";
        });
    }

    saveUser();
}

// ---------- NAVIGASI ----------
function showSection(sectionId) {
    document.querySelectorAll(".section").forEach(section => {
        section.style.display = "none";
        section.classList.remove("active");
    });

    const target = document.getElementById(sectionId);

    if (target) {
        target.style.display = "block";
        target.classList.add("active");
        target.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }

    document.querySelectorAll(
        ".nav-btn, .menu-btn, .navigation button"
    ).forEach(btn => {
        btn.classList.remove("active");
    });

    updateDashboard();
}

// ---------- SETOR LIMBAH ----------
const wasteTypes = [
    "Sisa Sayuran",
    "Kulit Buah",
    "Jerami",
    "Daun Kering",
    "Batang Tanaman",
    "Sisa Jagung",
    "Sekam Padi",
    "Tongkol Jagung",
    "Ampas Sayuran",
    "Limbah Buah",
    "Limbah Organik Lain"
];

function depositWaste() {
    const typeInput =
        document.getElementById("wasteType") ||
        document.querySelector("[name='wasteType']");

    const weightInput =
        document.getElementById("wasteWeight") ||
        document.querySelector("[name='wasteWeight']");

    if (!weightInput) return;

    const type = typeInput ? typeInput.value : "Limbah Organik Lain";
    const weight = parseFloat(weightInput.value);

    if (!weight || weight <= 0) {
        alert("Masukkan jumlah limbah yang valid.");
        return;
    }

    const coins = Math.floor(weight * 20);
    const xp = Math.floor(weight * 10);

    user.waste += weight;
    user.coins += coins;
    user.xp += xp;

    user.history.push({
        type: type,
        weight: weight,
        coins: coins,
        xp: xp,
        date: new Date().toLocaleString("id-ID")
    });

    saveUser();
    updateDashboard();

    alert(
        `Setoran berhasil! 🌱\n\n` +
        `Jenis: ${type}\n` +
        `Berat: ${weight} kg\n` +
        `+${coins} Eco Coin\n` +
        `+${xp} XP`
    );

    weightInput.value = "";
}

function exchangeReward(cost, rewardName) {
    if (user.coins < cost) {
        alert(
            `Eco Coin kamu belum cukup.\n\n` +
            `Dibutuhkan: ${cost} Eco Coin\n` +
            `Coin kamu: ${user.coins} Eco Coin`
        );
        return;
    }

    const confirmExchange = confirm(
        `Tukar ${cost} Eco Coin dengan ${rewardName}?`
    );

    if (!confirmExchange) return;

    user.coins -= cost;
    user.exchanges++;

    saveUser();
    updateDashboard();

    alert(
        `Berhasil! 🎁\n\n` +
        `${rewardName} berhasil ditukarkan.`
    );
}

// ---------- PREDIKSI PANEN ----------
const harvestData = {
    "Padi": 115,
    "Jagung": 100,
    "Kedelai": 90,
    "Cabai": 90,
    "Tomat": 75,
    "Kentang": 100,
    "Bawang Merah": 65,
    "Kacang Tanah": 100,

};

function predictHarvest() {
    const plantInput =
        document.getElementById("plantType") ||
        document.querySelector("[name='plantType']");

    const dateInput =
        document.getElementById("plantDate") ||
        document.querySelector("[name='plantDate']");

    const result =
        document.getElementById("harvestResult") ||
        document.querySelector(".harvest-result");

    if (!plantInput || !dateInput || !result) return;

    const plant = plantInput.value;
    const plantingDate = new Date(dateInput.value);

    if (!plant || isNaN(plantingDate.getTime())) {
        alert("Lengkapi jenis tanaman dan tanggal tanam.");
        return;
    }

    const days = harvestData[plant];

    if (!days) {
        alert("Data umur panen tanaman belum tersedia.");
        return;
    }

    const harvestDate = new Date(plantingDate);
    harvestDate.setDate(
        harvestDate.getDate() + days
    );

    const formattedDate =
        harvestDate.toLocaleDateString("id-ID", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    user.harvest = {
        plant: plant,
        days: days,
        date: formattedDate
    };

    saveUser();

    result.innerHTML = `
        <div class="harvest-result-box">
            <h3>🌾 Perkiraan Panen</h3>
            <p><strong>Tanaman:</strong> ${plant}</p>
            <p><strong>Umur panen:</strong> ±${days} hari</p>
            <p><strong>Perkiraan tanggal:</strong> ${formattedDate}</p>
            <small>
                Perkiraan dapat berbeda tergantung varietas,
                cuaca, kondisi tanah, dan perawatan.
            </small>
        </div>
    `;

    updateDashboard();
}

// ---------- IRIGASI PINTAR ----------
function calculateIrrigation() {
    const moisture =
        parseFloat(
            document.getElementById("soilMoisture")?.value
        );

    const temperature =
        parseFloat(
            document.getElementById("temperature")?.value
        );

    const weather =
        document.getElementById("weather")?.value || "";

    const phase =
        document.getElementById("plantPhase")?.value || "";

    const result =
        document.getElementById("irrigationResult") ||
        document.querySelector(".irrigation-result");

    if (!result) return;

    if (
        isNaN(moisture) ||
        isNaN(temperature)
    ) {
        alert("Masukkan kelembapan tanah dan suhu.");
        return;
    }

    let recommendation = "";
    let amount = "";

    if (
        moisture < 30 &&
        weather !== "hujan"
    ) {
        recommendation =
            "Tanaman membutuhkan penyiraman.";
        amount =
            "Lakukan penyiraman secara bertahap sampai kelembapan tanah cukup.";
    } else if (
        moisture >= 30 &&
        moisture <= 60
    ) {
        recommendation =
            "Kelembapan tanah cukup baik.";
        amount =
            "Belum perlu penyiraman berlebihan.";
    } else {
        recommendation =
            "Kelembapan tanah cukup tinggi.";
        amount =
            "Kurangi penyiraman dan pastikan drainase berjalan baik.";
    }

    if (weather === "hujan") {
        recommendation =
            "Kemungkinan tidak perlu penyiraman tambahan.";
    }

    if (temperature >= 32) {
        amount +=
            " Suhu cukup tinggi, pantau kelembapan lebih sering.";
    }

    if (phase === "berbunga") {
        amount +=
            " Pada fase berbunga, jaga kelembapan tetap stabil.";
    }

    user.irrigation = {
        moisture,
        temperature,
        weather,
        phase,
        recommendation
    };

    saveUser();

    result.innerHTML = `
        <div class="irrigation-result-box">
            <h3>💧 Rekomendasi Irigasi</h3>
            <p><strong>${recommendation}</strong></p>
            <p>${amount}</p>
        </div>
    `;

    updateDashboard();
}

// ---------- ANALISIS KAMERA ----------
function analyzePlantImage(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const img = new Image();

        img.onload = function() {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            const size = 100;

            canvas.width = size;
            canvas.height = size;

            ctx.drawImage(
                img,
                0,
                0,
                size,
                size
            );

            const data =
                ctx.getImageData(
                    0,
                    0,
                    size,
                    size
                ).data;

            let red = 0;
            let green = 0;
            let blue = 0;

            for (let i = 0; i < data.length; i += 4) {
                red += data[i];
                green += data[i + 1];
                blue += data[i + 2];
            }

            const total = data.length / 4;

            red /= total;
            green /= total;
            blue /= total;

            let result = "";

            if (
                green > red * 1.1 &&
                green > blue * 1.1
            ) {
                result =
                    "Warna hijau cukup dominan. Secara visual tanaman tampak memiliki area hijau yang cukup.";
            } else if (
                red > green * 1.15
            ) {
                result =
                    "Area merah/cokelat cukup dominan. Periksa kondisi daun dan lingkungan tanaman secara langsung.";
            } else if (
                red + green + blue < 180
            ) {
                result =
                    "Foto terlihat cukup gelap. Coba gunakan pencahayaan yang lebih baik.";
            } else {
                result =
                    "Kondisi visual belum dapat disimpulkan dengan jelas. Ambil foto tanaman dengan pencahayaan yang lebih terang.";
            }

            user.cameraUsed = true;
            saveUser();

            const output =
                document.getElementById("cameraResult") ||
                document.querySelector(".camera-result");

            if (output) {
                output.innerHTML = `
                    <div class="camera-result-box">
                        <h3>📷 Hasil Analisis Visual</h3>
                        <p>${result}</p>
                        <small>
                            Analisis ini hanya membaca karakteristik visual
                            foto dan bukan diagnosis penyakit tanaman.
                        </small>
                    </div>
                `;
            }

            updateDashboard();
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

// ---------- ECO AI ----------
function generateAIAnswer(question) {
    const q = question
        .toLowerCase()
        .trim();

    if (!q) {
        return "Silakan tuliskan pertanyaan terlebih dahulu.";
    }

    user.aiUsed = true;

    // Daun kuning
    if (
        q.includes("daun kuning") ||
        q.includes("daunnya kuning")
    ) {
        return `
        <strong>🍃 Daun menguning</strong><br><br>
        Daun kuning dapat disebabkan oleh kekurangan unsur hara,
        terlalu banyak air, kurang cahaya, kondisi akar,
        atau faktor usia daun.<br><br>
        Periksa kelembapan tanah, drainase, pencahayaan,
        dan kondisi akar sebelum menentukan tindakan.
        `;
    }

    // Layu
    if (
        q.includes("layu") ||
        q.includes("tanaman layu")
    ) {
        return `
        <strong>🌱 Tanaman layu</strong><br><br>
        Periksa kelembapan tanah terlebih dahulu.
        Tanah yang terlalu kering maupun terlalu basah
        dapat menyebabkan tanaman terlihat layu.<br><br>
        Pastikan juga akar tidak tergenang dan tanaman
        mendapatkan cahaya yang sesuai.
        `;
    }

    // Pupuk
    if (
        q.includes("pupuk") ||
        q.includes("pemupukan")
    ) {
        return `
        <strong>🌿 Tentang pupuk</strong><br><br>
        Pemilihan pupuk sebaiknya disesuaikan dengan
        jenis tanaman, umur tanaman, kondisi tanah,
        dan kebutuhan unsur hara.<br><br>
        Jangan memberikan pupuk secara berlebihan karena
        dapat mengganggu tanaman dan lingkungan tanah.
        `;
    }

    // Hama
    if (
        q.includes("hama") ||
        q.includes("serangga")
    ) {
        return `
        <strong>🐛 Pengendalian hama</strong><br><br>
        Mulailah dengan mengidentifikasi hama secara tepat.
        Gunakan pengendalian terpadu, seperti menjaga kebersihan
        lahan, memantau tanaman secara rutin, menggunakan
        perangkap, dan memilih metode pengendalian yang sesuai.
        `;
    }

    // Kompos
    if (
        q.includes("kompos") ||
        q.includes("limbah organik")
    ) {
        return `
        <strong>♻️ Kompos dari limbah organik</strong><br><br>
        Sisa sayuran, daun, jerami, dan bahan organik lainnya
        dapat dimanfaatkan menjadi kompos.<br><br>
        Pastikan bahan organik memiliki kelembapan yang cukup
        dan mendapatkan aerasi agar proses pengomposan berjalan baik.
        `;
    }

    // Maggot
    if (
        q.includes("maggot") ||
        q.includes("bsf")
    ) {
        return `
        <strong>🪰 Maggot / BSF</strong><br><br>
        Maggot dari Black Soldier Fly (BSF) dapat membantu
        mengolah sebagian limbah organik menjadi biomassa.
        Sisa hasil pengolahan juga dapat dimanfaatkan
        sesuai pengelolaan yang tepat.
        `;
    }

    // Panen
    if (
        q.includes("panen") ||
        q.includes("kapan panen")
    ) {
        return `
        <strong>🌾 Prediksi panen</strong><br><br>
        Umur panen berbeda-beda berdasarkan jenis dan varietas
        tanaman serta kondisi budidaya.<br><br>
        Gunakan menu <strong>Prediksi Panen</strong> di
        EcoFarming untuk mendapatkan perkiraan berdasarkan
        jenis tanaman dan tanggal tanam.
        `;
    }

    // Irigasi
    if (
        q.includes("irigasi") ||
        q.includes("menyiram") ||
        q.includes("penyiraman")
    ) {
        return `
        <strong>💧 Irigasi tanaman</strong><br><br>
        Penyiraman sebaiknya disesuaikan dengan kelembapan tanah,
        cuaca, suhu, jenis tanaman, dan fase pertumbuhan.<br><br>
        Hindari penyiraman berlebihan karena dapat menyebabkan
        akar kekurangan oksigen dan meningkatkan risiko masalah akar.
        `;
    }

    // Harga
    if (
        q.includes("harga") ||
        q.includes("komoditas") ||
        q.includes("harga tanaman")
    ) {
        return `
        <strong>💰 Harga komoditas</strong><br><br>
        EcoFarming menyediakan beberapa harga referensi
        komoditas pertanian pada dashboard.<br><br>
        Harga produsen dapat berbeda berdasarkan wilayah,
        waktu, kualitas, dan kondisi pasar.
        `;
    }

    // Kamera
    if (
        q.includes("kamera") ||
        q.includes("foto tanaman")
    ) {
        return `
        <strong>📷 Kamera Tanaman</strong><br><br>
        Fitur kamera EcoFarming melakukan analisis visual
        sederhana terhadap foto tanaman.<br><br>
        Hasil tersebut bukan diagnosis penyakit.
        Untuk masalah serius, pemeriksaan langsung oleh
        tenaga ahli pertanian tetap diperlukan.
        `;
    }

    // Coin
    if (
        q.includes("coin") ||
        q.includes("eco coin") ||
        q.includes("reward") ||
        q.includes("hadiah")
    ) {
        return `
        <strong>🪙 Eco Coin</strong><br><br>
        Setiap 1 kg limbah yang disetorkan memberikan
        <strong>20 Eco Coin</strong>.<br><br>

    // Tanaman
    if (
        q.includes("tanaman") ||
        q.includes("budidaya") ||
        q.includes("menanam")
    ) {
        return `
        <strong>🌱 Budidaya tanaman</strong><br><br>
        Keberhasilan budidaya dipengaruhi oleh kualitas benih,
        kondisi tanah, air, cahaya, nutrisi, pengendalian hama,

        Jika ingin mendapatkan jawaban lebih spesifik,
        tuliskan nama tanaman dan masalah yang sedang terjadi.
        `;
    }

    // Default
    return `
    <strong>🤖 EcoAI</strong><br><br>
    Saya bisa membantu menjelaskan berbagai topik pertanian,
    tanaman, pupuk, hama, irigasi, kompos, limbah organik,
    maggot/BSF, panen, harga komoditas, dan penggunaan fitur
    EcoFarming.<br><br>
    Coba tanyakan sesuatu seperti:
    <br>• Mengapa daun tanaman kuning?
    <br>• Bagaimana cara membuat kompos?
    <br>• Kapan tanaman padi bisa dipanen?
    <br>• Bagaimana cara mengatasi hama?
    <br>• Bagaimana penyiraman tanaman yang baik?
    `;
}

function askAI() {
    const input =
        document.getElementById("aiQuestion") ||
        document.querySelector("[name='aiQuestion']");

    const output =
        document.getElementById("aiAnswer") ||
        document.querySelector(".ai-answer");

    if (!input || !output) return;

    const question = input.value;

    if (!question.trim()) {
        alert("Tulis pertanyaan terlebih dahulu.");
        return;
    }

    output.innerHTML = generateAIAnswer(question);

    input.value = "";

    saveUser();
    updateDashboard();
}

        user.username
    );

    if (!newName || !newName.trim()) return;

    user.username = newName.trim();

    saveUser();
    updateDashboard();

    alert("Nama berhasil diperbarui.");
}

// ---------- EFEK NOTIFIKASI ----------
function showNotification(message) {
    const notification =
        document.createElement("div");

    notification.className =
        "eco-notification";

    notification.innerHTML = `
        <span>🌱</span>
        <span>${message}</span>
    `;

    notification.style.position = "fixed";
    notification.style.right = "20px";
    notification.style.bottom = "20px";
    notification.style.zIndex = "9999";
    notification.style.padding = "15px 20px";
    notification.style.borderRadius = "15px";
    notification.style.background = "#198754";
    notification.style.color = "white";
    notification.style.boxShadow =
        "0 10px 30px rgba(0,0,0,.2)";
    notification.style.animation =
        "slideIn .4s ease";

    document.body.appendChild(notification);

    setTimeout(() => {
        notification.remove();
    }, 3000);
}

// ---------- ANIMASI DAUN ----------
function createFloatingLeaves() {
    const container =
        document.querySelector(".leaf-background") ||
        document.querySelector(".floating-leaves");

    if (!container) return;

    const leaves = [
        "🌿",
        "🍃",
        "🌱",
        "🍀",
        "🌾",
        "🍂"
    ];

    for (let i = 0; i < 20; i++) {
        const leaf =
            document.createElement("span");

        leaf.textContent =
            leaves[Math.floor(Math.random() * leaves.length)];

        leaf.style.position = "absolute";
        leaf.style.left =
            Math.random() * 100 + "%";
        leaf.style.top =
            Math.random() * 100 + "%";
        leaf.style.fontSize =
            (15 + Math.random() * 25) + "px";
        leaf.style.opacity =
            0.15 + Math.random() * 0.25;
        leaf.style.animation =
            `floatLeaf ${
                8 + Math.random() * 10
            }s ease-in-out infinite`;

        container.appendChild(leaf);
    }
}

// ---------- EVENT LISTENER ----------
document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateDashboard();

        createFloatingLeaves();

        // Input kamera
        const cameraInput =
            document.getElementById("plantImage") ||
            document.querySelector(
                "input[type='file'][accept*='image']"
            );

        if (cameraInput) {
            cameraInput.addEventListener(
                "change",
                function() {
                    if (this.files && this.files[0]) {
                        analyzePlantImage(
                            this.files[0]
                        );
                    }
                }
            );
        }

        // Enter untuk EcoAI
        const aiInput =
            document.getElementById("aiQuestion");

        if (aiInput) {
            aiInput.addEventListener(
                "keydown",
                function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        askAI();
                    }
                }
            );
        }

        // Tombol navigasi otomatis
        document
            .querySelectorAll("[data-section]")
            .forEach(button => {
                button.addEventListener(
                    "click",
                    function() {
                        showSection(
                            this.dataset.section
                        );
                    }
                );
            });

        // Ganti nama
        document
            .querySelectorAll(
                ".change-username, #changeUsername"
            )
            .forEach(button => {
                button.addEventListener(
                    "click",
                    changeUsername
                );
            });

        // Reset
        document
            .querySelectorAll(
                ".reset-data, #resetData"
            )
            .forEach(button => {
                button.addEventListener(
                    "click",
                    resetData
                );
            });
    }
);

// ---------- GLOBAL FUNCTION ----------
window.showSection = showSection;
window.depositWaste = depositWaste;
window.exchangeReward = exchangeReward;
window.predictHarvest = predictHarvest;
window.calculateIrrigation = calculateIrrigation;
window.analyzePlantImage = analyzePlantImage;
window.generateAIAnswer = generateAIAnswer;
window.askAI = askAI;
window.resetData = resetData;
window.changeUsername = changeUsername;
window.showNotification = showNotification;
window.showCommodityPrice = showCommodityPrice;

</script>
