<script>
/* =========================================
   AGRI-SIAGA - SISTEM INFORMASI MUSIM
   ========================================= */

/* DATA WILAYAH */
const wilayahJawaTimur = {
    "Kabupaten Jombang": {
        musim: "Peralihan",
        curahHujan: 145,
        suhu: 28,
        kelembapan: 78
    },
    "Kabupaten Kediri": {
        musim: "Cenderung Basah",
        curahHujan: 180,
        suhu: 27,
        kelembapan: 82
    },
    "Kabupaten Malang": {
        musim: "Cenderung Basah",
        curahHujan: 210,
        suhu: 25,
        kelembapan: 85
    },
    "Kabupaten Mojokerto": {
        musim: "Peralihan",
        curahHujan: 155,
        suhu: 28,
        kelembapan: 79
    },
    "Kabupaten Nganjuk": {
        musim: "Cenderung Kering",
        curahHujan: 90,
        suhu: 29,
        kelembapan: 70
    },
    "Kabupaten Madiun": {
        musim: "Cenderung Kering",
        curahHujan: 85,
        suhu: 30,
        kelembapan: 68
    },
    "Kabupaten Ponorogo": {
        musim: "Peralihan",
        curahHujan: 135,
        suhu: 28,
        kelembapan: 75
    },
    "Kabupaten Banyuwangi": {
        musim: "Cenderung Basah",
        curahHujan: 225,
        suhu: 26,
        kelembapan: 86
    },
    "Kabupaten Blitar": {
        musim: "Peralihan",
        curahHujan: 150,
        suhu: 27,
        kelembapan: 79
    },
    "Kabupaten Tulungagung": {
        musim: "Peralihan",
        curahHujan: 140,
        suhu: 28,
        kelembapan: 77
    }
};


/* =========================================
   ELEMEN HTML
   ========================================= */

const wilayahSelect =
    document.getElementById("wilayah") ||
    document.getElementById("kabupaten") ||
    document.getElementById("kota");

const hasilMusim = document.getElementById("hasilMusim");
const statusMusim = document.getElementById("statusMusim");
const curahHujan = document.getElementById("curahHujan");
const suhu = document.getElementById("suhu");
const kelembapan = document.getElementById("kelembapan");
const rekomendasi = document.getElementById("rekomendasi");


/* =========================================
   FUNGSI MENENTUKAN IKON
   ========================================= */

function getIconMusim(musim) {

    if (musim === "Cenderung Basah") {
        return "🌧️";
    }

    if (musim === "Cenderung Kering") {
        return "☀️";
    }

    return "🌤️";
}


/* =========================================
   FUNGSI REKOMENDASI
   ========================================= */

function getRekomendasi(musim) {

    if (musim === "Cenderung Basah") {

        return `
            <strong>🌱 Rekomendasi Pertanian</strong>
            <p>
                Kondisi wilayah cenderung basah. 
                Perhatikan drainase lahan dan hindari genangan air.
                Pantau kemungkinan penyakit tanaman yang berkembang
                pada kondisi lembap.
            </p>
            <ul>
                <li>Periksa saluran drainase.</li>
                <li>Hindari penyiraman berlebihan.</li>
                <li>Pantau penyakit akibat kelembapan tinggi.</li>
            </ul>
        `;
    }

    if (musim === "Cenderung Kering") {

        return `
            <strong>🌾 Rekomendasi Pertanian</strong>
            <p>
                Kondisi wilayah cenderung kering. 
                Ketersediaan air perlu diperhatikan agar tanaman
                tetap mendapatkan kebutuhan air yang cukup.
            </p>
            <ul>
                <li>Periksa kelembapan tanah.</li>
                <li>Gunakan irigasi secara efisien.</li>
                <li>Manfaatkan penampungan air.</li>
            </ul>
        `;
    }

    return `
        <strong>🌿 Rekomendasi Pertanian</strong>
        <p>
            Wilayah berada pada kondisi peralihan. 
            Pantau perubahan cuaca dan kondisi tanah secara berkala
            sebelum menentukan kegiatan budidaya.
        </p>
        <ul>
            <li>Pantau prakiraan hujan.</li>
            <li>Periksa kelembapan tanah.</li>
            <li>Sesuaikan penyiraman dengan kondisi lahan.</li>
        </ul>
    `;
}


/* =========================================
   TAMPILKAN DATA WILAYAH
   ========================================= */

function tampilkanDataWilayah(namaWilayah) {

    const data = wilayahJawaTimur[namaWilayah];

    if (!data) {
        alert("Silakan pilih wilayah terlebih dahulu.");
        return;
    }

    const icon = getIconMusim(data.musim);

    if (hasilMusim) {
        hasilMusim.style.display = "block";
    }

    if (statusMusim) {
        statusMusim.innerHTML =
            `${icon} ${data.musim}`;
    }

    if (curahHujan) {
        curahHujan.innerHTML =
            `${data.curahHujan} mm`;
    }

    if (suhu) {
        suhu.innerHTML =
            `${data.suhu}°C`;
    }

    if (kelembapan) {
        kelembapan.innerHTML =
            `${data.kelembapan}%`;
    }

    if (rekomendasi) {
        rekomendasi.innerHTML =
            getRekomendasi(data.musim);
    }

    /* Animasi hasil */
    if (hasilMusim) {
        hasilMusim.classList.remove("hasil-muncul");

        setTimeout(() => {
            hasilMusim.classList.add("hasil-muncul");
        }, 50);
    }
}


/* =========================================
   EVENT PILIH WILAYAH
   ========================================= */

if (wilayahSelect) {

    wilayahSelect.addEventListener("change", function () {

        const namaWilayah = this.value;

        if (namaWilayah) {
            tampilkanDataWilayah(namaWilayah);
        }

    });

}


/* =========================================
   TOMBOL CEK MUSIM
   ========================================= */

const tombolCek =
    document.getElementById("cekMusim") ||
    document.getElementById("btnCekMusim");

if (tombolCek) {

    tombolCek.addEventListener("click", function () {

        if (!wilayahSelect || !wilayahSelect.value) {

            alert("🌱 Silakan pilih wilayah terlebih dahulu.");

            return;
        }

        tampilkanDataWilayah(wilayahSelect.value);

    });

}


/* =========================================
   DATA MANUAL
   Jika pengguna memasukkan data sendiri
   ========================================= */

function analisisDataManual(hujan, suhuData, kelembapanData) {

    hujan = Number(hujan);
    suhuData = Number(suhuData);
    kelembapanData = Number(kelembapanData);

    let musim;

    if (hujan >= 170 || kelembapanData >= 82) {

        musim = "Cenderung Basah";

    } else if (hujan <= 100 || kelembapanData <= 70) {

        musim = "Cenderung Kering";

    } else {

        musim = "Peralihan";

    }

    return {
        musim: musim,
        hujan: hujan,
        suhu: suhuData,
        kelembapan: kelembapanData
    };
}


/* =========================================
   FUNGSI TOMBOL ANALISIS DATA
   ========================================= */

const tombolAnalisis =
    document.getElementById("analisisData");

if (tombolAnalisis) {

    tombolAnalisis.addEventListener("click", function () {

        const inputHujan =
            document.getElementById("inputCurahHujan");

        const inputSuhu =
            document.getElementById("inputSuhu");

        const inputKelembapan =
            document.getElementById("inputKelembapan");

        if (
            !inputHujan ||
            !inputSuhu ||
            !inputKelembapan
        ) {
            return;
        }

        if (
            inputHujan.value === "" ||
            inputSuhu.value === "" ||
            inputKelembapan.value === ""
        ) {

            alert("Lengkapi semua data terlebih dahulu.");

            return;
        }

        const hasil = analisisDataManual(
            inputHujan.value,
            inputSuhu.value,
            inputKelembapan.value
        );

        if (statusMusim) {
            statusMusim.innerHTML =
                `${getIconMusim(hasil.musim)} ${hasil.musim}`;
        }

        if (curahHujan) {
            curahHujan.innerHTML =
                `${hasil.hujan} mm`;
        }

        if (suhu) {
            suhu.innerHTML =
                `${hasil.suhu}°C`;
        }

        if (kelembapan) {
            kelembapan.innerHTML =
                `${hasil.kelembapan}%`;
        }

        if (rekomendasi) {
            rekomendasi.innerHTML =
                getRekomendasi(hasil.musim);
        }

        if (hasilMusim) {
            hasilMusim.style.display = "block";
        }
    });

}


/* =========================================
   DATA WILAYAH OTOMATIS KE SELECT
   ========================================= */

function isiWilayahOtomatis() {

    if (!wilayahSelect) return;

    /*
       Hanya mengisi jika select masih kosong.
       Jadi tidak merusak pilihan yang sudah
       dibuat di HTML.
    */

    if (wilayahSelect.options.length <= 1) {

        Object.keys(wilayahJawaTimur).forEach(
            function(namaWilayah) {

                const option =
                    document.createElement("option");

                option.value = namaWilayah;
                option.textContent = namaWilayah;

                wilayahSelect.appendChild(option);
            }
        );
    }
}


/* =========================================
   ANIMASI CARD
   ========================================= */

const cards =
    document.querySelectorAll(".card, .weather-card, .stat-card");

cards.forEach(function(card, index) {

    card.style.opacity = "0";
    card.style.transform = "translateY(15px)";

    setTimeout(function() {

        card.style.transition =
            "all 0.5s ease";

        card.style.opacity = "1";
        card.style.transform =
            "translateY(0)";

    }, index * 100);

});


/* =========================================
   NOTIFIKASI
   ========================================= */

function notifikasiAGRI(pesan) {

    const box =
        document.createElement("div");

    box.innerHTML =
        `🌱 ${pesan}`;

    box.style.position = "fixed";
    box.style.bottom = "25px";
    box.style.right = "25px";
    box.style.padding = "15px 20px";
    box.style.background = "#198754";
    box.style.color = "white";
    box.style.borderRadius = "15px";
    box.style.boxShadow =
        "0 8px 25px rgba(0,0,0,.2)";
    box.style.zIndex = "9999";
    box.style.fontWeight = "600";

    document.body.appendChild(box);

    setTimeout(function() {
        box.style.opacity = "0";
        box.style.transition =
            "opacity .5s ease";

        setTimeout(function() {
            box.remove();
        }, 500);

    }, 3000);
}


/* =========================================
   INISIALISASI
   ========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        isiWilayahOtomatis();

        console.log(
            "🌱 AGRI-SIAGA berhasil dijalankan!"
        );

    }
);
</script>
